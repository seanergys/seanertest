version: 1

services:
  - name: seanergys.flux
    software:
      spack: spack.yaml
    driver:
      name: flux
      config:
        generic:
          config: configs/generic/config.toml
          hosts: configs/generic/hosts.yaml
        Asys:
          config: configs/Asys/config.toml
          hosts: configs/Asys/hosts.yaml
        Bsys:
          config: configs/Bsys/config.toml
          hosts: configs/Bsys/hosts.yaml

  - name: minio
    image: minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: seanergys
      MINIO_ROOT_PASSWORD: seanergys-example-password
    ports:
      - 9000

  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seanergys
      POSTGRES_USER: seanergys
      POSTGRES_PASSWORD: seanergys-example-password
    setup:
      - until pg_isready -U seanergys -d seanergys; do sleep 1; done
    ports:
      - 5432
