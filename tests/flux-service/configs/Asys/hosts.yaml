version: 1

brokers:
  roles:
    - control
    - login
    - compute

login:
  role: login

resources:
  - role: control
    cores: "0"
    properties: [control, asys]
    schedulable: false

  - role: login
    cores: "0"
    properties: [login, asys]
    schedulable: false

  - role: compute
    cores: "0"
    properties: [compute, asys]
    schedulable: true
