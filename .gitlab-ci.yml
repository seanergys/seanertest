stages:
  - check
  - test
  - publish

test_file_names:
  stage: check
  tags:
    - docker
  image: alpine:latest
  script:
    - |
      set -euo pipefail
      MISNAMED_FILES=$(find tests/ -type f -name '*.py' -not -name 'test_main.py')
      if test -n "$MISNAMED_FILES";
      then
        echo '[!!] All python files in tests/ must be called test_main.py, offending files:'
        echo $MISNAMED_FILES
        false
      fi
      echo 'test filename check passed'

lint:reuse:
  stage: check
  tags:
    - docker
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint

# The testbed runner, with the tags shell, testbed, generic and micro, provides
# Docker, minikube and uv. seanerops and seanerstack come from the package
# index that the CI/CD variables UV_INDEX and PIP_EXTRA_INDEX_URL name, with
# their credentials; see the README. They are set outside this repository, so
# that moving to another index changes no file here.
.shell:
  tags:
    - shell
    - testbed
    - generic
    - micro

selftest:
  extends: .shell
  stage: test
  script:
    - uv run pytest -v --junitxml junit-selftest.xml tests/selftest-*
  artifacts:
    when: always
    reports:
      junit: junit-selftest.xml

integration:minikube:
  extends: .shell
  stage: test
  resource_group: minikube
  variables:
    MINIKUBE_PROFILE: seanertest-ci
    KUBECONFIG: ${CI_PROJECT_DIR}/.ci/kubeconfig
    # Kept on the runner, so that later pipelines install binaries instead of
    # building them.
    SEANERTEST_CACHE_DIR: ${HOME}/.cache/seanertest-ci
    # Fixed, so that a firewall on the runner can allow exactly this port from
    # the minikube network.
    SEANERTEST_CACHE_PORT: "18080"
  before_script:
    - mkdir -p .ci
    - minikube delete --profile "$MINIKUBE_PROFILE" || true
    - minikube start --profile "$MINIKUBE_PROFILE" --driver docker --cpus 4 --memory 8g --wait all
    - scripts/minikube-target.sh "$MINIKUBE_PROFILE" "$KUBECONFIG" "$SEANERTEST_CACHE_PORT" > .ci/target.yml
  script:
    - >-
      uv run pytest -v -s --target .ci/target.yml --junitxml junit-integration.xml
      $(find tests -mindepth 1 -maxdepth 1 -type d ! -name 'selftest-*' | sort)
  after_script:
    - minikube delete --profile "$MINIKUBE_PROFILE" || true
  artifacts:
    when: always
    reports:
      junit: junit-integration.xml

publish:
  stage: publish
  tags:
    - docker
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  environment:
    name: gitlab-pypi
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Publishing seanertest ${VERSION} to GitLab PyPI"
    - PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
    - >-
      if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
      echo "Tag ${CI_COMMIT_TAG} does not match version ${PACKAGE_VERSION} in pyproject.toml";
      exit 1;
      fi
    - uv build --no-sources
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"

# Living at head: every push to the default branch publishes a development
# build, <next patch>.dev<pipeline number>, for example 0.1.4.dev57. Consumers
# that ask for development builds get the newest one; tagged releases stay the
# stable versions and sort after the development builds before them.
publish:dev:
  stage: publish
  tags:
    - docker
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  environment:
    name: gitlab-pypi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - uv version --frozen --bump patch --bump "dev=${CI_PIPELINE_IID}"
    - echo "Publishing seanertest $(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])') to GitLab PyPI"
    - uv build --no-sources
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"
