stages:
  - check
  - test

test_file_names:
  stage: check
  image: alpine:latest
  script:
    - |
      set -euo pipefail
      MISNAMED_FILES=$(find tests/ -type f -name '*.py' -not -name 'test_main.py')
      if test -n "$MISNAMED_FILES";
      then
        echo '[!!] All python files in tests/ must be called test_main.py, offending files:'
        echo $MISNAMED_FILES
        false
      fi
      echo 'test filename check passed'

lint:reuse:
  stage: check
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint

# The runner tagged `shell` provides Docker, minikube and uv. seanerops and
# seanerstack are installed from GitLab with the job token, passed through
# Git's environment configuration so that nothing is written to the runner.
.shell:
  tags:
    - shell
  variables:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.seanergys.fz-juelich.de/.insteadOf"
    GIT_CONFIG_VALUE_0: "https://gitlab.seanergys.fz-juelich.de/"
    SEANERTEST_GIT_USERNAME: gitlab-ci-token
    SEANERTEST_GIT_TOKEN: ${CI_JOB_TOKEN}

selftest:
  extends: .shell
  stage: test
  script:
    - uv run pytest -v --junitxml junit-selftest.xml tests/selftest-*
  artifacts:
    when: always
    reports:
      junit: junit-selftest.xml

integration:minikube:
  extends: .shell
  stage: test
  resource_group: minikube
  variables:
    MINIKUBE_PROFILE: seanertest-ci
    KUBECONFIG: ${CI_PROJECT_DIR}/.ci/kubeconfig
    # Kept on the runner, so that later pipelines install binaries instead of
    # building them.
    SEANERTEST_CACHE_DIR: ${HOME}/.cache/seanertest-ci
  before_script:
    - mkdir -p .ci
    - minikube delete --profile "$MINIKUBE_PROFILE" || true
    - minikube start --profile "$MINIKUBE_PROFILE" --driver docker --cpus 4 --memory 8g --wait all
    - scripts/minikube-target.sh "$MINIKUBE_PROFILE" "$KUBECONFIG" > .ci/target.yml
  script:
    - >-
      uv run pytest -v -s --target .ci/target.yml --junitxml junit-integration.xml
      $(find tests -mindepth 1 -maxdepth 1 -type d ! -name 'selftest-*' | sort)
  after_script:
    - minikube delete --profile "$MINIKUBE_PROFILE" || true
  artifacts:
    when: always
    reports:
      junit: junit-integration.xml
