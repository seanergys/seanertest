stages:
  - test

pytest:
  stage: test
  image: python:3.12

  tags:
    - docker
    - dind

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e .

  script:
    - pytest -v
