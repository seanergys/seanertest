stages:
  - generate
  - test

generate-test-pipeline:
  stage: generate
  image: python:3.12-alpine
  tags:
    - docker
  script:
    - python scripts/generate-test-pipeline.py > generated-test-pipeline.yml
    - cat generated-test-pipeline.yml
  artifacts:
    paths:
      - generated-test-pipeline.yml

run-tests:
  stage: test
  trigger:
    include:
      - artifact: generated-test-pipeline.yml
        job: generate-test-pipeline
    strategy: mirror
