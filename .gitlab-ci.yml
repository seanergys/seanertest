stages:
  - check
  - generate
  - test

test_file_names:
  stage: check
  image: alpine:latest
  script:
    - |
      set -euo pipefail
      MISNAMED_FILES=$(find tests/ -type f -name '*.py' -not -name 'test_main.py')
      if test -n "$MISNAMED_FILES";
      then
        echo '[!!] All python files in tests/ must be called test_main.py, offending files:'
        echo $MISNAMED_FILES
        false
      fi
      echo 'test filename check passed'

lint:reuse:
  stage: check
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint

generate-test-pipeline:
  stage: generate
  image: python:3.12-alpine
  tags:
    - docker
  before_script:
    - python -m pip install PyYAML
  script:
    - python scripts/generate-test-pipeline.py > generated-test-pipeline.yml
    - cat generated-test-pipeline.yml
  artifacts:
    paths:
      - generated-test-pipeline.yml

run-tests:
  stage: test
  trigger:
    include:
      - artifact: generated-test-pipeline.yml
        job: generate-test-pipeline
    strategy: mirror
