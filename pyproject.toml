[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seanertest"
version = "0.3.0"
description = "Integration tests for SEANERGYS services on testbeds"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1",
  "kubernetes>=31",
  "PyYAML>=6.0",
  "pytest>=8.0",
  # The .dev0 bounds let uv choose development builds: the newest build of
  # main, or a newer release. Where they come from is configured in uv, not
  # here.
  "seanerops>=0.2.0.dev0",
  "seanerstack>=0.1.3.dev0",
]

[dependency-groups]
docs = [
  "properdocs>=1.6.7",
  "mkdocs-materialx>=10.2.0",
]

[project.entry-points.pytest11]
seanertest = "seanertest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/seanertest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test file is called test_main.py, so modules are imported by path.
addopts = "--import-mode=importlib"
