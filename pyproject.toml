[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seanertest"
version = "0.3.0"
description = "Integration tests for SEANERGYS services on testbeds"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1",
  "kubernetes>=31",
  "PyYAML>=6.0",
  "pytest>=8.0",
  # The .dev0 bound lets uv choose development builds: the newest build of
  # main, or a newer release. Where it comes from is configured in uv, not
  # here.
  "seanerops>=0.2.0.dev0",
  # One release, because the build container installs the same version and
  # every hash depends on the Spack and the spack-packages commit it pins.
  "seanerstack==0.1.4",
]

[dependency-groups]
docs = [
  "properdocs>=1.6.7",
  "mkdocs-materialx>=10.2.0",
]

[project.entry-points.pytest11]
seanertest = "seanertest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/seanertest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test file is called test_main.py, so modules are imported by path.
addopts = "--import-mode=importlib"
